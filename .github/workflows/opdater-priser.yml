name: Hent dagens elpriser

on:
  schedule:
    - cron: '15 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kildekode
        uses: actions/checkout@v4

      - name: Opsæt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Kør pris-script
        run: node update.js

      - name: Commit og push ændringer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add data.json
          git commit -m "Automatisk opdatering af elpriser" || exit 0
          git push
